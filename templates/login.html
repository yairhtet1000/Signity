<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Signity</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero small">
        <div>
          <p class="eyebrow">Signity</p>
          <h1>Sign in</h1>
          <p class="hero-text">
            Choose the correct account type. User accounts require admin
            approval.
          </p>
        </div>
      </header>
      {% with messages=get_flashed_messages(with_categories=true) %}{% for
      category, message in messages %}
      <p class="toast toast-{{ category }}">{{ message }}</p>
      {% endfor %}{% endwith %}
      <section class="section">
        <div class="card auth-card">
          <form method="post">
            <input
              type="hidden"
              name="csrf_token"
              value="{{ csrf_token() }}"
            /><label
              >Email<input
                name="email"
                type="email"
                autocomplete="email"
                required /></label
            ><label
              >Password<input
                name="password"
                type="password"
                autocomplete="current-password"
                required /></label
            ><label
              >Account type<select name="role">
                <option value="user">User</option>
                <option value="admin">Admin</option>
              </select></label
            ><button class="button button-primary" type="submit">
              Sign in
            </button>
          </form>
          <p>Need an account? <a href="/register">Register</a>.</p>
        </div>
      </section>
    </main>
  </body>
</html>
